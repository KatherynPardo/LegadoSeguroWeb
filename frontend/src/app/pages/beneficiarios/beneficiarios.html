<header class="barra">
  <h1>Mis Herederos</h1>
</header>

<section class="pagina">
  <div class="acciones">
    <button class="btn btn-primary">+ Nuevo Heredero</button>
  </div>

  <div class="tarjeta">
    <table class="tabla">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Parentesco</th>
          <th>Correo</th>
        </tr>
      </thead>
      <tbody>
        @for (b of beneficiarios(); track b.id) {
        <tr>
          <td class="nombre">{{ b.nombres }} {{ b.apellidos }}</td>
          <td>{{ b.parentesco }}</td>
          <td>{{ b.correo ?? '—' }}</td>
        </tr>
        } @empty {
        <tr>
          <td colspan="3" class="vacio">No hay beneficiarios. ¿Está encendido el backend?</td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</section>
