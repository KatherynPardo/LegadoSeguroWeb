<!-- Tabla de beneficiarios -->
<div class="container mt-5">
    <h2 class="mb-4">LegadoSeguro · Beneficiarios</h2>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>Parentesco</th>
                <th>Correo</th>
            </tr>
        </thead>
        <tbody>
            @for (b of beneficiarios(); track b.id) {
            <tr>
                <td>{{ b.id }}</td>
                <td>{{ b.nombres }}</td>
                <td>{{ b.apellidos }}</td>
                <td>{{ b.parentesco }}</td>
                <td>{{ b.correo ?? '—' }}</td>
            </tr>
            } @empty {
            <tr>
                <td colspan="5" class="text-center">No hay beneficiarios. ¿Está encendido el backend?</td>
            </tr>
            }
        </tbody>
    </table>
</div>
