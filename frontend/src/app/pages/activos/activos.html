<div class="container mt-5">
    <h2 class="mb-4">LegadoSeguro · Activos digitales</h2>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Tipo</th>
                <th>Sensibilidad</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            @for (a of activos(); track a.id) {
            <tr>
                <td>{{ a.id }}</td>
                <td>{{ a.nombre }}</td>
                <td>{{ a.descripcion ?? '—' }}</td>
                <td>{{ a.tipo }}</td>
                <td>{{ a.sensibilidad }}</td>
                <td>{{ a.estado }}</td>
            </tr>
            } @empty {
            <tr>
                <td colspan="6" class="text-center">No hay activos. ¿Está encendido el backend?</td>
            </tr>
            }
        </tbody>
    </table>
</div>
