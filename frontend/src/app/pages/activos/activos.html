<header class="barra">
  <h1>Mis Activos</h1>
</header>

<section class="pagina">
  <div class="acciones">
    <button class="btn btn-primary" (click)="mostrarFormulario.set(true)">+ Nuevo Activo</button>
  </div>

  @if (mostrarFormulario()) {
  <form class="tarjeta formulario" (ngSubmit)="guardar()">
    <h2 class="titulo-form">Nuevo activo digital</h2>

    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" class="form-control" required [(ngModel)]="nuevo.nombre" />

    <label for="tipo">Tipo</label>
    <select id="tipo" name="tipo" class="form-select" [(ngModel)]="nuevo.id_tipo">
      @for (t of tipos; track t.id) {
      <option [ngValue]="t.id">{{ t.nombre }}</option>
      }
    </select>

    <label for="descripcion">Descripción</label>
    <input id="descripcion" name="descripcion" class="form-control" [(ngModel)]="nuevo.descripcion" />

    <div class="botones-form">
      <button type="button" class="btn btn-outline-secondary" (click)="mostrarFormulario.set(false)">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </form>
  }

  <div class="tarjeta">
    <table class="tabla">
      <thead>
        <tr>
          <th>Activo</th>
          <th>Tipo</th>
          <th>Sensibilidad</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (a of activos(); track a.id) {
        <tr>
          <td class="nombre">{{ a.nombre }}</td>
          <td>{{ a.tipo }}</td>
          <td class="sens" [class.financiera]="a.sensibilidad === 'FINANCIERA'">{{ a.sensibilidad }}</td>
          <td class="estado">{{ a.estado }}</td>
        </tr>
        } @empty {
        <tr>
          <td colspan="4" class="vacio">No hay activos. ¿Está encendido el backend?</td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</section>
